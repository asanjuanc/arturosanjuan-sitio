<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 305" width="470" role="img" aria-label="Plano de parametros a y b: la recta b igual a separa el caso subamortiguado del sobreamortiguado" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"><defs><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2563a8"/></marker><marker id="ahw" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#c1440e"/></marker><marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#5a6570"/></marker><marker id="ahi" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#1e2327"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><polygon points="70.0,262.0 300.0,32.0 70.0,32.0" stroke="none" stroke-width="0" fill="#e6eef8" stroke-linejoin="round" stroke-linecap="round"/><polygon points="70.0,262.0 300.0,32.0 440.0,32.0 440.0,262.0" stroke="none" stroke-width="0" fill="#fbe9e2" stroke-linejoin="round" stroke-linecap="round"/><line x1="70" y1="262" x2="450" y2="262" stroke="#5a6570" stroke-width="1.4" marker-end="url(#ahm)"/><line x1="70" y1="270" x2="70" y2="18" stroke="#5a6570" stroke-width="1.4" marker-end="url(#ahm)"/><line x1="70" y1="262" x2="300" y2="32" stroke="#2563a8" stroke-width="2.6" /><line x1="70" y1="262" x2="440" y2="262" stroke="#1a7f5a" stroke-width="4" /><text x="440" y="284" text-anchor="end" fill="#5a6570" font-size="13" font-weight="normal"><tspan font-style="italic">a</tspan> = √(<tspan font-style="italic">k</tspan>/<tspan font-style="italic">M</tspan>)</text><text x="78" y="18" text-anchor="start" fill="#5a6570" font-size="13" font-weight="normal"><tspan font-style="italic">b</tspan> = <tspan font-style="italic">c</tspan>/(2<tspan font-style="italic">M</tspan>)</text><text x="100" y="76" text-anchor="start" fill="#2563a8" font-size="14" font-weight="bold">Sobreamortiguado</text><text x="100" y="94" text-anchor="start" fill="#2563a8" font-size="13" font-weight="normal"><tspan font-style="italic">b</tspan> &gt; <tspan font-style="italic">a</tspan></text><text x="100" y="112" text-anchor="start" fill="#5a6570" font-size="12.5" font-weight="normal">dos raíces reales negativas</text><text x="318" y="150" text-anchor="start" fill="#c1440e" font-size="14" font-weight="bold">Subamortiguado</text><text x="318" y="168" text-anchor="start" fill="#c1440e" font-size="13" font-weight="normal"><tspan font-style="italic">b</tspan> &lt; <tspan font-style="italic">a</tspan></text><text x="318" y="186" text-anchor="start" fill="#5a6570" font-size="12.5" font-weight="normal">λ = −<tspan font-style="italic">b</tspan> ± <tspan font-style="italic">iα</tspan></text><text x="318" y="204" text-anchor="start" fill="#5a6570" font-size="12.5" font-weight="normal">hay oscilación</text><text x="274" y="72" text-anchor="start" fill="#2563a8" font-size="13" font-weight="bold"><tspan font-style="italic">b</tspan> = <tspan font-style="italic">a</tspan>: crítico</text><text x="262" y="248" text-anchor="middle" fill="#1a7f5a" font-size="13" font-weight="bold"><tspan font-style="italic">b</tspan> = 0: armónico, λ = ±<tspan font-style="italic">ia</tspan></text></svg>
